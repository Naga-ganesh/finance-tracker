<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5e4d"><title>Finance</title>
<style>
:root{color-scheme:light dark;--bg:#f6f8f7;--tx:#14211d;--mut:#62706b;--ink:#0f5e4d;--on:#fff;--rule:#d7dedb;--bad:#b4341c;--ok:#1f7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1714;--tx:#e6efeb;--mut:#8da39b;--ink:#6fd3b5;--on:#0a1f19;--rule:#25352f;--bad:#ff8b6b;--ok:#5fd39a}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}.bad{color:var(--bad)}.ok{color:var(--ok)}
button{font:inherit;border:0;border-radius:8px;padding:12px 16px;background:var(--ink);color:var(--on);font-weight:600}
button.ghost{background:none;color:var(--ink);padding:8px}button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--tx);margin:5px 0}
.big{font:700 34px/1.1 Georgia,serif;color:var(--ink);margin:10px 0 4px}.big small{font:14px system-ui;color:var(--mut)}
nav{display:flex;border-bottom:2px solid var(--rule);margin:12px 0 4px}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--ink);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:10px 0}.seg button{flex:1;background:none;color:var(--tx);border-radius:0;padding:8px;font-weight:400}.seg button.on{background:var(--ink);color:var(--on)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-weight:400;color:var(--mut);text-align:right;padding:4px 0}td{padding:5px 0;border-top:1px solid var(--rule);text-align:right}th:first-child,td:first-child{text-align:left}
details{border-bottom:1px solid var(--rule);padding:10px 0}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.panel{padding:14px 0;border-bottom:1px solid var(--rule)}.panel h4{margin:0 0 8px;font:600 16px system-ui}
.chip{font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:0 6px;color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:1px solid var(--rule)}
.mb{flex:1;height:100%;display:flex;flex-direction:column-reverse;cursor:pointer}.mb b,.mb u{display:block;background:var(--ink)}.mb u{opacity:.35}.mb.sel{outline:2px solid var(--ink)}
.ml{display:flex;gap:3px;font-size:10px;text-align:center;color:var(--mut);margin-top:3px}.ml span{flex:1}
#sheet{position:fixed;inset:0;background:rgba(5,15,12,.55);z-index:5;overflow:auto}#sh{background:var(--bg);margin:40px auto 0;max-width:560px;min-height:100%;padding:18px 16px 40px;border-radius:16px 16px 0 0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:10px 16px;border-radius:99px;z-index:9}
.kr{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}.kr b{text-align:right;font:700 17px Georgia,serif;color:var(--ink)}.kr.kh span{text-align:right}.kr.kh span:first-child{text-align:left}
.pbar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:4px 0 8px}.pbar i{display:block;height:100%;background:var(--ink)}
.bb{position:relative;display:flex;height:12px;background:var(--rule);border-radius:3px;margin:8px 0 4px}.bb i{display:block;height:100%;background:var(--ink)}.bb i.to{opacity:.4}.bb b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--tx);border-radius:2px}
.lg{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
</style></head><body><main>
<section id="login" hidden>
  <div class="big" style="margin-top:60px">Finance</div><p class="mut">Sign in to continue.</p>
  <input id="u" placeholder="Username" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="Passphrase" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()">
  <p id="err" class="bad"></p><button onclick="login()" style="width:100%">Sign in</button>
</section>
<section id="app" hidden>
  <div class="row"><b>Finance · Bonds</b><button class="ghost" onclick="logout()">Log out</button></div>
  <nav id="tabs"></nav><div id="view"></div>
</section></main>
<div id="sheet" hidden><div id="sh"></div></div><div id="toast" hidden></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxnm9l9eMmKeXikaylc0Fjj4e1_ioYM1gLtUn4X23f7cuJUQyg16li64Ipr8AKUCgYc/exec';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f0=n=>'₹'+Math.round(n).toLocaleString('en-IN'),f2=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
/*CALC_START*/
const DAY=864e5,UTC=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)},ISO=t=>new Date(t).toISOString().slice(0,10),eom=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
let TODAY=(()=>{const d=new Date(Date.now()+19800000);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())})();
function setToday(t){TODAY=t}
// interest per period = units x face x coupon x days / 365, paid on each bond's payment day (31 = month end)
function analyse(b,txs){
  const T=txs.filter(t=>t.isin===b.isin).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  if(!T.length)return null;
  let u=0,cost=0,real=0;const steps=[],rl={};
  T.forEach(t=>{if(t.type==='BUY'){u+=t.units;cost+=t.amount}else{const avg=u?cost/u:0,g=t.amount-avg*t.units;rl[t.id]=g;real+=g;cost-=avg*t.units;u-=t.units}steps.push([UTC(t.date),u])});
  const mat=UTC(b.maturity),start=steps[0][0],pud=b.face*b.coupon/100/365;
  const acc=(from,to)=>{let s=0;steps.forEach(([d,x],i)=>{const a=Math.max(from,d),e=Math.min(to,i+1<steps.length?steps[i+1][0]:Infinity);if(e>a)s+=(e-a)/DAY*x});return s};
  const pd=[],sd=new Date(start);
  for(let m=sd.getUTCMonth()-1;;m++){const y=sd.getUTCFullYear()+Math.floor(m/12),mo=((m%12)+12)%12,d=Date.UTC(y,mo,Math.min(b.payday,eom(y,mo)));if(d>=mat)break;pd.push(d)}
  pd.push(mat);
  const pays=[];
  for(let i=1;i<pd.length;i++){const amt=Math.round(acc(pd[i-1],pd[i])*pud*100)/100;if(amt>0)pays.push({d:pd[i],amt,isin:b.isin,name:b.name,tds:b.tds,rec:pd[i]<=TODAY})}
  const gross=pays.reduce((s,p)=>s+p.amt,0),rec=pays.filter(p=>p.rec).reduce((s,p)=>s+p.amt,0);
  const y=b.ytm/100,yrs=(mat-start)/DAY/365,el=Math.max(0,Math.min(TODAY,mat)-start)/DAY/365;
  const yt=cost*(Math.pow(1+y,yrs)-1),ya=cost*(Math.pow(1+y,el)-1);
  return{b,u,cost,real,start,mat,pays,gross,rec,rem:gross-rec,rl,perYear:u*b.face*b.coupon/100,ytmYear:cost*y,ytmTotal:yt,ytmAcc:ya,ytmRem:yt-ya,active:u>0&&mat>TODAY};
}
function build(d){const A=d.bonds.map(b=>analyse(b,d.tx)).filter(Boolean);return{A,pays:A.flatMap(a=>a.pays)}}
/*CALC_END*/
const fd=t=>new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
const lab=k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('en-IN',{month:'long',year:'numeric',timeZone:'UTC'});
const mab=k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('en-IN',{month:'short',timeZone:'UTC'});
const mkey=i=>{const n=new Date(TODAY);return ISO(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()+i,1)).slice(0,7)};
let S=Object.assign({tab:'over',net:false},JSON.parse(localStorage.getItem('fb')||'{}'));
try{S.data=JSON.parse(localStorage.getItem('fbd'))}catch(e){}
async function api(action,d={}){let j;
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:S.token,...d})});j=await r.json()}catch(e){throw new Error('Network problem. Try again.')}
  if(j.error==='AUTH'){logout();throw new Error('Session expired. Sign in again.')}
  if(j.error)throw new Error(j.error);return j}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function setData(j){S.data={bonds:j.bonds,tx:j.tx};try{localStorage.setItem('fbd',JSON.stringify(S.data))}catch(e){}draw()}
async function load(){try{setData(await api('data'))}catch(e){toast(e.message)}}
async function login(){$('#err').textContent='';try{const j=await api('login',{username:$('#u').value,passphrase:$('#p').value});
  S.token=j.token;S.user=j.user;localStorage.setItem('fb',JSON.stringify({token:S.token,user:S.user}));setData(j)}catch(e){$('#err').textContent=e.message}}
function logout(){localStorage.removeItem('fb');localStorage.removeItem('fbd');S={tab:'over',net:false};draw()}
function draw(){
  if(!S.token){$('#login').hidden=false;$('#app').hidden=true;return}
  $('#login').hidden=true;$('#app').hidden=false;
  $('#tabs').innerHTML=[['over','Bonds'],['int','Interest'],['tx','Trades']].map(([k,t])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';draw()">${t}</button>`).join('');
  if(!S.data){$('#view').innerHTML='<p class=mut>Loading…</p>';return}
  S.B=build(S.data);({over:vOver,int:vInt,tx:vTx})[S.tab]()}
const kf=t=>S.net?1-t/100:1;
const fc=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':f0(n);
const sn=a=>a.b.name.replace(/ (Ltd|Limited|Financiers|Finance)\b.*$/i,'')+' '+a.b.isin.slice(-4);
function donut(P,mid){const T=P.reduce((s,p)=>s+p.v,0)||1;let off=25;
  return `<svg viewBox="0 0 42 42" width="190" height="190" style="display:block;margin:6px auto" role="img" aria-label="Share by bond"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--rule)" stroke-width="7"/>${P.map(p=>{const d=p.v/T*100,c=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${p.c}" stroke-width="7" stroke-dasharray="${d} ${100-d}" stroke-dashoffset="${off}"/>`;off-=d;return c}).join('')}<text x="21" y="22.2" text-anchor="middle" font-size="4" font-weight="700" fill="var(--tx)">${mid}</text></svg>`}
function kpi(L){const s=g=>L.reduce((t,a)=>t+g(a)*kf(a.b.tds),0),e=s(a=>a.rec),T=s(a=>a.gross),ye=s(a=>a.ytmAcc),yT=s(a=>a.ytmTotal);
  const row=(l,c,y)=>`<div class=kr><span>${l}</span><b>${f0(c)}</b><b>${f0(y)}</b></div>`,pc=(x,t)=>t?Math.round(Math.min(100,x/t*100)):0,pb=(x,t)=>`<div class=pbar><i style="width:${pc(x,t)}%"></i></div>`;
  return `<div class="kr kh"><span></span><span class=mut>Coupon</span><span class=mut>At YTM</span></div>${row('Earned till today',e,ye)}${row('Still to come',T-e,yT-ye)}${row('Total, start to maturity',T,yT)}
  <div class=mut style="margin-top:8px">${pc(e,T)}% of coupon interest earned</div>${pb(e,T)}<div class=mut>${pc(ye,yT)}% of YTM return accrued</div>${pb(ye,yT)}`}
function vOver(){
  const act=S.B.A.filter(a=>a.active).sort((a,b)=>a.mat-b.mat),sold=S.B.A.filter(a=>!a.active&&a.u===0),K=a=>kf(a.b.tds);
  const R=[['Per month',a=>a.perYear/12,a=>a.ytmYear/12],['Per year',a=>a.perYear,a=>a.ytmYear],['Till date (received / accrued)',a=>a.rec,a=>a.ytmAcc],['To maturity (remaining)',a=>a.rem,a=>a.ytmRem],['Total, start to maturity',a=>a.gross,a=>a.ytmTotal]];
  const tbl=L=>`<table><tr><th></th><th>Coupon</th><th>At YTM</th></tr>${R.map(([t,c,y])=>`<tr><td>${t}</td><td>${f0(L.reduce((s,a)=>s+c(a)*K(a),0))}</td><td>${f0(L.reduce((s,a)=>s+y(a)*K(a),0))}</td></tr>`).join('')}</table>`;
  S.pm=S.pm||'T';const val={T:a=>a.gross*K(a),E:a=>a.rec*K(a),I:a=>a.cost}[S.pm];
  const P=act.map((a,i)=>({a,c:`hsl(${Math.round(i*360/act.length)+150} 55% 52%)`,v:val(a)})),TT=P.reduce((s,p)=>s+p.v,0);
  const mx=Math.max(1,...act.map(a=>Math.max(a.gross,a.ytmTotal)*K(a))),inv=act.reduce((s,a)=>s+a.cost,0),face=act.reduce((s,a)=>s+a.u*a.b.face,0),yr=act.reduce((s,a)=>s+a.perYear*K(a),0);
  const bch=a=>{const g={};a.pays.forEach(p=>{const m=ISO(p.d).slice(0,7);g[m]=g[m]||{r:0,p:0};g[m][p.rec?'r':'p']+=p.amt*K(a)});const W=Array.from({length:19},(_,i)=>mkey(i-6)),m2=Math.max(1,...W.map(m=>(g[m]?.r||0)+(g[m]?.p||0)));
    return `<div class=chart style="height:80px">${W.map(m=>`<div class=mb><b style="height:${(g[m]?.r||0)/m2*100}%"></b><u style="height:${(g[m]?.p||0)/m2*100}%"></u></div>`).join('')}</div><div class=ml>${W.map(m=>`<span>${mab(m)[0]}</span>`).join('')}</div>`};
  $('#view').innerHTML=`<div class=seg><button class="${S.net?'':'on'}" onclick="S.net=false;draw()">Before TDS</button><button class="${S.net?'on':''}" onclick="S.net=true;draw()">After TDS</button></div>
  <div class=panel><h4>All bonds together</h4><div class=mut style="margin-bottom:6px">Invested ${f0(inv)} · Face ${f0(face)} · About ${f0(yr/12)} a month, ${f0(yr)} a year</div>${kpi(act)}</div>
  <div class=panel><h4>Where the interest comes from</h4><div class=seg>${[['T','Total to maturity'],['E','Earned so far'],['I','Invested']].map(([k,t])=>`<button class="${S.pm===k?'on':''}" onclick="S.pm='${k}';draw()">${t}</button>`).join('')}</div>${donut(P,fc(TT))}
  ${[...P].sort((x,y)=>y.v-x.v).map(p=>`<div class=lg><span><i style="background:${p.c}"></i>${esc(sn(p.a))}</span><span>${f0(p.v)} <span class=mut>${TT?(p.v/TT*100).toFixed(1):0}%</span></span></div>`).join('')}</div>
  <div class=panel style="border:0;padding-bottom:0"><h4>Each bond: earned and still to come</h4><div class=mut>Solid = earned till today. Light = still to come on coupons. Black line = total at YTM. Tap a bond to open it.</div></div>`+
  act.map(a=>{const T=a.gross*K(a),e=a.rec*K(a),Y=a.ytmTotal*K(a);
    return `<details><summary><div class=row><b>${esc(a.b.name)}</b><span class=mut>${a.b.isin}</span></div><div class=bb><i style="width:${e/mx*100}%"></i><i class=to style="width:${(T-e)/mx*100}%"></i><b style="left:${Y/mx*100}%"></b></div>
    <div class="row mut" style="font-size:13px"><span>Earned ${f0(e)}</span><span>Total ${f0(T)}</span><span>At YTM ${f0(Y)}</span></div></summary>
    <div class=mut style="margin:10px 0">${a.u} units · coupon ${a.b.coupon}% · YTM ${a.b.ytm}%<br>Start ${fd(a.start)} · Maturity ${fd(a.mat)} · ${((a.mat-TODAY)/DAY/365.25).toFixed(1)} yrs left<br>Invested ${f0(a.cost)} · Face ${f0(a.u*a.b.face)} · At maturity ${a.u*a.b.face-a.cost<0?'loss':'gain'} ${f0(Math.abs(a.u*a.b.face-a.cost))} vs cost</div>
    ${kpi([a])}<div class=mut style="margin:12px 0 4px">Interest by month (solid = received, light = projected)</div>${bch(a)}<div style="height:10px"></div>${tbl([a])}</details>`}).join('')+
  (sold.length?`<div class=panel><h4>Sold</h4>${sold.map(a=>`<div class=row><span>${esc(a.b.name)} <span class=mut>${a.b.isin}</span></span><span class="${a.real<0?'bad':'ok'}">${f0(a.real)}</span></div>`).join('')}</div>`:'')+
  `<p class=mut>Interest = units × face × coupon × days ÷ 365, from your deal date, paid on each bond's payment day. At YTM = cost × ((1+YTM)^years − 1), which assumes coupons are reinvested at the YTM. After TDS applies each bond's TDS % to every interest figure. Estimates, not advice.</p>`}
function vInt(){
  const cur=mkey(0),g={};S.mo=S.mo||cur;
  S.B.pays.forEach(p=>{const m=ISO(p.d).slice(0,7),x=g[m]=g[m]||{r:0,p:0,L:[]};x[p.rec?'r':'p']+=p.amt*kf(p.tds);x.L.push(p)});
  const W=Array.from({length:16},(_,i)=>mkey(i-3)),mx=Math.max(1,...W.map(m=>(g[m]?.r||0)+(g[m]?.p||0))),X=g[S.mo]||{L:[]};
  const gr=X.L.reduce((s,p)=>s+p.amt,0),td=X.L.reduce((s,p)=>s+p.amt*p.tds/100,0);
  $('#view').innerHTML=`<div class=panel><h4>Interest by month</h4><div class=chart>${W.map(m=>`<div class="mb${m===S.mo?' sel':''}" onclick="S.mo='${m}';draw()"><b style="height:${(g[m]?.r||0)/mx*100}%"></b><u style="height:${(g[m]?.p||0)/mx*100}%"></u></div>`).join('')}</div>
  <div class=ml>${W.map(m=>`<span>${mab(m)}</span>`).join('')}</div><p class=mut style="margin:6px 0 0">Solid = received, light = projected. ${S.net?'After':'Before'} TDS (change on the Bonds tab).</p></div>
  <div class=row style="margin:8px 0"><button class=ghost onclick="mo(-1)">‹</button><b>${lab(S.mo)}</b><button class=ghost onclick="mo(1)">›</button></div>`+
  (X.L.length?[...X.L].sort((a,b)=>a.d-b.d).map(p=>`<div class=panel style="padding:8px 0"><div class=row><span>${fd(p.d).slice(0,6)} · ${esc(p.name)}</span><b>${f2(p.amt*kf(p.tds))}</b></div><div class="row mut"><span>${p.isin}</span><span class="${p.rec?'ok':''}">${p.rec?'Received':'Projected'}</span></div></div>`).join('')+
  `<div class=panel><div class=row><span>Gross</span><b>${f2(gr)}</b></div><div class="row mut"><span>TDS</span><span>${f2(td)}</span></div><div class=row><span>Net</span><b>${f2(gr-td)}</b></div></div>`:'<p class=mut>No interest payments this month.</p>')}
function mo(d){const[y,m]=S.mo.split('-').map(Number);S.mo=ISO(Date.UTC(y,m-1+d,1)).slice(0,7);draw()}
function vTx(){
  const rl={};S.B.A.forEach(a=>Object.assign(rl,a.rl));
  $('#view').innerHTML=`<div class=row style="gap:8px;margin:12px 0"><button onclick="openBuy()" style="flex:1">Add / buy bond</button><button onclick="openSell()" style="flex:1">Sell bond</button></div>`+
  [...S.data.tx].sort((a,b)=>a.date<b.date?1:-1).map(t=>{const b=S.data.bonds.find(x=>x.isin===t.isin)||{name:t.isin};
    return `<div class=panel style="padding:10px 0"><div class=row><b>${esc(b.name)}</b><span>${f0(t.amount)}</span></div><div class="row mut"><span>${fd(UTC(t.date))} · <span class=chip>${t.type}</span> ${t.units} units${t.note?' · '+esc(t.note):''}</span><button class=ghost onclick="delTx('${t.id}')">Delete</button></div>${t.type==='SELL'?`<div class="${rl[t.id]<0?'bad':'ok'}">Realized ${f0(rl[t.id]||0)}</div>`:''}</div>`}).join('')}
function closeS(){$('#sheet').hidden=true}
function openBuy(){$('#sheet').hidden=false;
  $('#sh').innerHTML=`<h3 style="margin:0 0 8px">Add / buy bond</h3>
  <select id=bs onchange="$('#nb').hidden=this.value!=='new'"><option value=new>New bond…</option>${S.data.bonds.map(b=>`<option value="${b.isin}">${esc(b.name)} (${b.isin})</option>`).join('')}</select>
  <div id=nb><input id=ni placeholder="ISIN (12 characters)"><input id=nn placeholder="Bond name"><input id=nf type=number placeholder="Face value per unit, e.g. 10000"><input id=nc type=number step=any placeholder="Coupon %"><input id=ny type=number step=any placeholder="YTM %">
  <label class=mut>Maturity date</label><input id=nm type=date><input id=np type=number placeholder="Interest payment day (31 = month end)"><input id=nt type=number value=10 placeholder="TDS %"></div>
  <label class=mut>Deal date</label><input id=bd type=date value="${ISO(TODAY)}"><input id=bu type=number step=any placeholder="Units"><input id=ba type=number step=any placeholder="Total amount paid (₹)"><input id=bn placeholder="Note (optional)">
  <div class=row style="gap:8px;margin-top:8px"><button class=ghost onclick=closeS()>Cancel</button><button id=go onclick=saveBuy() style="flex:1">Save</button></div>`}
async function saveBuy(){const v=id=>$('#'+id).value.trim(),nw=v('bs')==='new',isn=nw?v('ni').toUpperCase():v('bs');
  const bond=nw?{isin:isn,name:v('nn'),face:+v('nf'),coupon:+v('nc'),ytm:+v('ny'),maturity:v('nm'),payday:+v('np'),tds:+v('nt')}:null;
  $('#go').disabled=true;try{setData(await api('addTx',{bond,tx:{date:v('bd'),isin:isn,type:'BUY',units:+v('bu'),amount:+v('ba'),note:v('bn')}}));closeS();toast('Saved')}catch(e){toast(e.message);$('#go').disabled=false}}
function openSell(){const H=S.B.A.filter(a=>a.u>0);$('#sheet').hidden=false;
  $('#sh').innerHTML=`<h3 style="margin:0 0 8px">Sell bond</h3><select id=ss onchange=sg()>${H.map(a=>`<option value="${a.b.isin}">${esc(a.b.name)} (${a.b.isin}) · ${a.u} units</option>`).join('')}</select>
  <label class=mut>Sale date</label><input id=sd type=date value="${ISO(TODAY)}"><input id=su type=number step=any placeholder="Units sold" oninput=sg()><input id=sa type=number step=any placeholder="Total sale proceeds (₹)" oninput=sg()><input id=sn placeholder="Note (optional)">
  <div id=sgh class=mut style="min-height:20px"></div><div class=row style="gap:8px;margin-top:8px"><button class=ghost onclick=closeS()>Cancel</button><button id=go onclick=saveSell() style="flex:1">Record sale</button></div>`}
function sg(){const a=S.B.A.find(x=>x.b.isin===$('#ss').value),u=+$('#su').value||0,p=+$('#sa').value||0;$('#sgh').textContent=a&&u?`Average cost ${f0(a.cost/a.u)} per unit. Realized ${f0(p-a.cost/a.u*u)}`:''}
async function saveSell(){const v=id=>$('#'+id).value.trim();$('#go').disabled=true;
  try{setData(await api('addTx',{tx:{date:v('sd'),isin:v('ss'),type:'SELL',units:+v('su'),amount:+v('sa'),note:v('sn')}}));closeS();toast('Sale recorded')}catch(e){toast(e.message);$('#go').disabled=false}}
async function delTx(id){if(!confirm('Delete this transaction?'))return;try{setData(await api('delTx',{id}))}catch(e){toast(e.message)}}
draw();if(S.token)load();
</script></body></html>
