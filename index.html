<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5e4d"><title>Finance PA · Bond Portfolio</title>
<style>
:root{color-scheme:light dark;--bg:#0b1210;--panel:#131e1a;--tx:#e3ece8;--mut:#859e95;--ink:#58c9a6;--ink-light:#152b24;--on:#081712;--rule:#20332c;--bad:#f1948a;--ok:#52be80;--gold:#f4d03f;--shadow:0 4px 14px rgba(0,0,0,0.3)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0}
main{max-width:1400px;margin:0 auto;padding:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:var(--ink);color:var(--on);font-weight:600;cursor:pointer;transition:opacity .15s}
button.ghost{background:none;color:var(--ink);padding:6px 12px;border:1px solid var(--rule)}
button:disabled{opacity:.5}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--tx);margin:4px 0}
.big{font:700 32px/1.1 Georgia,serif;color:var(--ink);margin:8px 0 4px}
nav{display:flex;gap:6px;border-bottom:2px solid var(--rule);margin:16px 0 12px;overflow-x:auto}
nav button{background:none;color:var(--mut);border-radius:0;padding:10px 16px;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ink);font-weight:700}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel);padding:2px}
.seg button{flex:1;background:transparent;color:var(--tx);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:500;border:0}
.seg button.on{background:var(--ink);color:var(--on);font-weight:700}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:border-color .2s}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;display:inline-block}
.badge-sec{background:#194d33;color:#7dcea0}
.badge-unsec{background:#4a1b17;color:#f5b7b1}
.kpi-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
.kpi-box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.kpi-box span{display:block;font-size:12px;color:var(--mut)}.kpi-box b{font-size:22px;color:var(--ink);font-family:Georgia,serif}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);padding:12px 16px;border-radius:10px;border:1px solid var(--rule);margin-bottom:16px}
.toolbar input[type="search"]{min-width:280px;flex:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;overflow:auto;display:flex;justify-content:center;align-items:center}
#sh{background:var(--bg);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;padding:24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);border:1px solid var(--rule)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:10px 20px;border-radius:99px;z-index:100;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-weight:600;color:var(--mut);text-align:right;padding:8px 4px;border-bottom:1px solid var(--rule)}td{padding:8px 4px;border-top:1px solid var(--rule);text-align:right}th:first-child,td:first-child{text-align:left}
.pbar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--ink)}
.date-group{background:var(--panel);border:1px solid var(--rule);border-radius:10px;margin-bottom:12px;overflow:hidden}
.date-header{background:var(--ink-light);padding:10px 16px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between}
.chart-container{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:20px;margin:16px 0;text-align:center}
.clickable-row{cursor:pointer}.clickable-row:hover{background:var(--ink-light)}
.chart-bar{cursor:pointer;transition:opacity .15s}.chart-bar:hover{opacity:0.85}
.donut-slice{cursor:pointer;transition:transform .15s}.donut-slice:hover{opacity:0.85}
</style></head><body><main>
<section id="login" hidden>
  <div style="max-width:360px;margin:80px auto;text-align:center" class="kpi-box">
    <div class="big">Finance PA</div><p class="mut">Bond Portfolio Assistant</p>
    <input id="u" placeholder="Username" autocapitalize="none" style="width:100%">
    <input id="p" type="password" placeholder="Passphrase" style="width:100%" onkeydown="event.key=='Enter'&&login()">
    <p id="err" class="bad"></p><button onclick="login()" style="width:100%;margin-top:10px">Sign in</button>
  </div>
</section>
<section id="app" hidden>
  <div class="row">
    <div><b style="font-size:20px;color:var(--ink)">Finance PA · Bond Portfolio</b><span id="match-count" class="mut" style="margin-left:12px"></span></div>
    <div class="row">
      <button class="ghost" onclick="S.q='';$('#q').value='';draw()">❌ Clear Filter</button>
      <button class="ghost" onclick="load()">🔄 Refresh</button>
      <button class="ghost" onclick="logout()">Log out</button>
    </div>
  </div>
  <nav id="tabs"></nav>
  <div class="toolbar">
    <input type="search" id="q" placeholder="🔍 Search (e.g. maturity:2028, secured:yes, coupon>10, kosamattam)..." oninput="S.q=this.value;draw()">
    <select id="sort" onchange="S.sort=this.value;draw()">
      <option value="inv_desc">Sort: Highest Invested</option>
      <option value="inc_desc">Sort: Highest Monthly Income</option>
      <option value="mat_asc">Sort: Earliest Maturity</option>
      <option value="mat_desc">Sort: Latest Maturity</option>
      <option value="sec_desc">Sort: Secured First</option>
    </select>
    <div class="seg">
      <button class="${!S.net?'on':''}" onclick="S.net=false;draw()">Gross</button>
      <button class="${S.net?'on':''}" onclick="S.net=true;draw()">Net (TDS)</button>
    </div>
    <div class="seg">
      <button class="${S.chartType==='bar'?'on':''}" onclick="S.chartType='bar';draw()">Bar</button>
      <button class="${S.chartType==='donut'?'on':''}" onclick="S.chartType='donut';draw()">Donut</button>
    </div>
  </div>
  <div id="view"></div>
</section></main>
<div id="sheet" hidden><div id="sh"></div></div><div id="toast" hidden></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxnm9l9eMmKeXikaylc0Fjj4e1_ioYM1gLtUn4X23f7cuJUQyg16li64Ipr8AKUCgYc/exec';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f0=n=>'₹'+Math.round(n||0).toLocaleString('en-IN'),f2=n=>'₹'+(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const DAY=864e5,UTC=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)},ISO=t=>new Date(t).toISOString().slice(0,10),eom=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
let TODAY=(()=>{const d=new Date(Date.now()+19800000);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())})();

const PALETTE=['#58c9a6','#52be80','#f4d03f','#e59866','#af7ac5','#5499c7','#48c9b0','#f1948a','#a569bd','#45b39d','#f5b041','#5d6d7e'];
function getBondColor(isin,allBonds){
  const idx=allBonds.findIndex(b=>b.b.isin===isin);
  return PALETTE[idx % PALETTE.length];
}

function analyse(b,txs){
  const T=txs.filter(t=>t.isin===b.isin).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  if(!T.length)return null;
  let u=0,cost=0,real=0;const steps=[],rl={};
  T.forEach(t=>{if(t.type==='BUY'){u+=t.units;cost+=t.amount}else{const avg=u?cost/u:0,g=t.amount-avg*t.units;rl[t.id]=g;real+=g;cost-=avg*t.units;u-=t.units}steps.push([UTC(t.date),u])});
  const mat=UTC(b.maturity),start=steps[0][0],pud=b.face*b.coupon/100/365;
  const acc=(from,to)=>{let s=0;steps.forEach(([d,x],i)=>{const a=Math.max(from,d),e=Math.min(to,i+1<steps.length?steps[i+1][0]:Infinity);if(e>a)s+=(e-a)/DAY*x});return s};
  const pd=[],sd=new Date(start);
  for(let m=sd.getUTCMonth()-1;;m++){const y=sd.getUTCFullYear()+Math.floor(m/12),mo=((m%12)+12)%12,d=Date.UTC(y,mo,Math.min(b.payday,eom(y,mo)));if(d>=mat)break;pd.push(d)}
  pd.push(mat);
  const pays=[];
  for(let i=1;i<pd.length;i++){const amt=Math.round(acc(pd[i-1],pd[i])*pud*100)/100;if(amt>0)pays.push({d:pd[i],amt,isin:b.isin,name:b.name,tds:b.tds,rec:pd[i]<=TODAY})}
  const gross=pays.reduce((s,p)=>s+p.amt,0),rec=pays.filter(p=>p.rec).reduce((s,p)=>s+p.amt,0);
  const y=b.ytm/100,yrs=(mat-start)/DAY/365,el=Math.max(0,Math.min(TODAY,mat)-start)/DAY/365;
  const yt=cost*(Math.pow(1+y,yrs)-1),ya=cost*(Math.pow(1+y,el)-1);
  return{b,u,cost,real,start,mat,pays,gross,rec,rem:gross-rec,rl,perYear:u*b.face*b.coupon/100,ytmYear:cost*y,ytmTotal:yt,ytmAcc:ya,ytmRem:yt-ya,active:u>0&&mat>TODAY};
}

function build(d){const A=d.bonds.map(b=>analyse(b,d.tx)).filter(Boolean);return{A,pays:A.flatMap(a=>a.pays)}}
const fd=t=>new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
const lab=k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('en-IN',{month:'long',year:'numeric',timeZone:'UTC'});
const mab=k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('en-IN',{month:'short',timeZone:'UTC'});
const mkey=i=>{const n=new Date(TODAY);return ISO(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()+i,1)).slice(0,7)};

let S=Object.assign({
  tab:'over',net:false,sort:'inv_desc',chartType:'bar',q:'',
  targetGoal:10000000,neftStart:ISO(TODAY).slice(0,7)+'-01',neftEnd:ISO(TODAY),
  roadmapMode:'monthly',scenarios:{},currentScenario:'Default',lumpsums:{}
},JSON.parse(localStorage.getItem('fb')||'{}'));
try{S.data=JSON.parse(localStorage.getItem('fbd'))}catch(e){}

async function api(action,d={}){let j;
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:S.token,...d})});
    j=await r.json();
  }catch(e){throw new Error('Network / Apps Script error.')}
  if(j.error==='AUTH'){logout();throw new Error('Session expired.')}
  if(j.error)throw new Error(j.error);return j;
}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function setData(j){S.data={bonds:j.bonds,tx:j.tx};try{localStorage.setItem('fbd',JSON.stringify(S.data))}catch(e){}draw()}
async function load(){
  try{
    const res = await api('data');
    setData(res);
  }catch(e){
    toast(e.message);
    if(!S.token) { $('#login').hidden=false; $('#app').hidden=true; }
  }
}

async function login(){
  $('#err').textContent='';
  try{
    const j=await api('login',{username:$('#u').value,passphrase:$('#p').value});
    S.token=j.token;S.user=j.user;
    localStorage.setItem('fb',JSON.stringify({token:S.token,user:S.user}));
    setData(j);
  }catch(e){$('#err').textContent=e.message}
}

function logout(){
  localStorage.removeItem('fb');localStorage.removeItem('fbd');
  S={tab:'over',net:false,sort:'inv_desc',chartType:'bar',q:'',roadmapMode:'monthly',scenarios:{},currentScenario:'Default',lumpsums:{}};
  draw();
}

function draw(){
  if(!S.token){$('#login').hidden=false;$('#app').hidden=true;return}
  $('#login').hidden=true;$('#app').hidden=false;
  
  $('#tabs').innerHTML=[['over','Bonds Dashboard'],['int','Interest Calendar'],['reconcile','Bank Reconcile (NEFT)'],['roadmap','Roadmap & Predictions'],['tx','Trades Log']].map(([k,t])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';draw()">${t}</button>`).join('');
  
  if(!S.data){
    $('#view').innerHTML='<p class="mut" style="padding:40px;text-align:center">Loading bond engine…</p>';
    return;
  }
  S.B=build(S.data);
  ({over:vOver,int:vInt,reconcile:vReconcile,roadmap:vRoadmap,tx:vTx})[S.tab]();
}

const kf=t=>S.net?1-t/100:1;
const fc=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':f0(n);

function filterBonds(A){
  const rawQ=S.q.trim().toLowerCase();
  if(!rawQ)return A;

  return A.filter(a=>{
    if(rawQ.startsWith('isin:')) return a.b.isin.toLowerCase()===rawQ.split(':')[1];
    if(rawQ.includes(':') || rawQ.includes('>')){
      const parts=rawQ.split(/\s+/);
      let match=true;
      parts.forEach(p=>{
        if(p.startsWith('maturity:')){
          const yr=p.split(':')[1];
          if(!new Date(a.mat).toISOString().startsWith(yr))match=false;
        }else if(p.startsWith('secured:')){
          const val=p.split(':')[1];
          const isSec=a.b.secured===1||a.b.secured===true||a.b.secured==='1';
          if(val==='yes'||val==='true'){if(!isSec)match=false;}
          else{if(isSec)match=false;}
        }else if(p.startsWith('coupon>')){
          const minC=parseFloat(p.split('>')[1]);
          if(!(a.b.coupon>minC))match=false;
        }else if(p.startsWith('isin:')){
          const sub=p.split(':')[1];
          if(!a.b.isin.toLowerCase().includes(sub))match=false;
        }else{
          const term=p;
          if(!a.b.name.toLowerCase().includes(term)&&!a.b.isin.toLowerCase().includes(term))match=false;
        }
      });
      return match;
    }
    return a.b.name.toLowerCase().includes(rawQ)||a.b.isin.toLowerCase().includes(rawQ);
  });
}

function sortBonds(A){
  const list=[...A];
  if(S.sort==='inv_desc')list.sort((a,b)=>b.cost-a.cost);
  if(S.sort==='inc_desc')list.sort((a,b)=>b.perYear-a.perYear);
  if(S.sort==='mat_asc')list.sort((a,b)=>a.mat-b.mat);
  if(S.sort==='mat_desc')list.sort((a,b)=>b.mat-a.mat);
  if(S.sort==='sec_desc')list.sort((a,b)=>(b.b.secured||0)-(a.b.secured||0));
  return list;
}

function vOver(){
  let act=filterBonds(S.B.A.filter(a=>a.active));
  act=sortBonds(act);
  $('#match-count').textContent=`(${act.length} bonds matching)`;

  const inv=act.reduce((s,a)=>s+a.cost,0);
  const face=act.reduce((s,a)=>s+a.u*a.b.face,0);
  const yr=act.reduce((s,a)=>s+a.perYear*kf(a.b.tds),0);
  const grossTot=act.reduce((s,a)=>s+a.gross*kf(a.b.tds),0);
  const totalPayoutVal = inv + grossTot;
  const absReturnPct=inv?((grossTot/inv)*100).toFixed(1):0;

  const minStart=act.length?Math.min(...act.map(a=>a.start)):TODAY;
  const maxMat=act.length?Math.max(...act.map(a=>a.mat)):TODAY;

  let chartHtml='';
  if(S.chartType==='bar'){
    const maxVal=Math.max(1,...act.map(a=>a.gross*kf(a.b.tds)));
    chartHtml=`<div class="chart-container">
      <h4>Portfolio Payout Distribution (Click bar to filter bond)</h4>
      <div style="display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:20px;overflow-x:auto">
        ${act.map(a=>{
          const val=a.gross*kf(a.b.tds);
          const h=Math.round((val/maxVal)*110);
          const c=getBondColor(a.b.isin,S.B.A);
          return `<div class="chart-bar" onclick="S.q='isin:${a.b.isin}';$('#q').value='isin:${a.b.isin}';draw()" style="flex:1;min-width:36px;display:flex;flex-direction:column;align-items:center">
            <div style="height:${h}px;width:100%;background:${c};border-radius:4px 4px 0 0" title="Click to filter: ${a.b.name}"></div>
            <span class="mut" style="font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.b.isin.slice(-4)}</span>
          </div>`
        }).join('')}
      </div>
    </div>`;
  }else{
    const totalV=act.reduce((s,a)=>s+a.cost,0)||1;
    let accum=0;
    chartHtml=`<div class="chart-container">
      <h4>Capital Invested Share (Click slice to filter bond)</h4>
      <svg viewBox="0 0 42 42" width="160" height="160" style="margin:10px auto;display:block">
        <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--rule)" stroke-width="7"/>
        ${act.map(a=>{
          const pct=(a.cost/totalV)*100;
          const dash=`${pct} ${100-pct}`;
          const offset=25-accum;
          accum+=pct;
          const c=getBondColor(a.b.isin,S.B.A);
          return `<circle class="donut-slice" onclick="S.q='isin:${a.b.isin}';$('#q').value='isin:${a.b.isin}';draw()" cx="21" cy="21" r="15.9155" fill="none" stroke="${c}" stroke-width="7" stroke-dasharray="${dash}" stroke-dashoffset="${offset}"><title>Click to filter: ${a.b.name}</title></circle>`;
        }).join('')}
        <text x="21" y="22" text-anchor="middle" font-size="4" font-weight="700" fill="var(--tx)">${f0(totalV)}</text>
      </svg>
    </div>`;
  }

  $('#view').innerHTML=`
  <div class="kpi-container">
    <div class="kpi-box"><span>Total Capital Invested</span><b>${f0(inv)}</b></div>
    <div class="kpi-box"><span>Total Face Value</span><b>${f0(face)}</b></div>
    <div class="kpi-box"><span>Monthly Income</span><b>${f0(yr/12)}</b></div>
    <div class="kpi-box"><span>Total Earnings + YTM</span><b>${f0(grossTot)} <small style="font-size:13px;color:var(--ok)">(+${absReturnPct}%)</small></b></div>
    <div class="kpi-box"><span>Total Maturity Payout</span><b style="color:var(--ok)">${f0(totalPayoutVal)}</b></div>
    <div class="kpi-box"><span>Investment Horizon</span><b style="font-size:15px">${fd(minStart)} ➔ ${fd(maxMat)}</b></div>
  </div>

  ${chartHtml}

  <div class="card-grid">`+
  act.map(a=>{
    const T=a.gross*kf(a.b.tds),e=a.rec*kf(a.b.tds),Y=a.ytmTotal*kf(a.b.tds);
    const pct=T?Math.min(100,Math.round(e/T*100)):0;
    const isSec=a.b.secured===1||a.b.secured===true||a.b.secured==='1';
    const c=getBondColor(a.b.isin,S.B.A);

    const yrsCrossed=((TODAY-a.start)/DAY/365.25).toFixed(1);
    const yrsPending=((a.mat-TODAY)/DAY/365.25).toFixed(1);

    return `
    <div class="card" style="border-top:4px solid ${c}">
      <div class="card-header">
        <div>
          <b style="font-size:16px;color:${c}">${esc(a.b.name)}</b>
          <div class="mut">${a.b.isin}</div>
        </div>
        <span class="badge ${isSec?'badge-sec':'badge-unsec'}">${isSec?'Secured':'Unsecured'}</span>
      </div>
      <div style="margin:6px 0;display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:13px">
        <div>Start Date: <b>${fd(a.start)}</b></div>
        <div>Maturity: <b>${fd(a.mat)}</b></div>
        <div>Crossed: <b class="ok">${yrsCrossed} yrs</b></div>
        <div>Pending: <b class="bad">${yrsPending} yrs</b></div>
        <div>Invested: <b>${f0(a.cost)}</b></div>
        <div>Units: <b>${a.u}</b></div>
        <div>Coupon: <b class="ok">${a.b.coupon}%</b></div>
        <div>YTM: <b>${a.b.ytm}%</b></div>
        <div>Monthly: <b>${f0(a.perYear*kf(a.b.tds)/12)}</b></div>
      </div>
      <div class="mut">Progress (${pct}% received)</div>
      <div class="pbar"><i style="width:${pct}%;background:${c}"></i></div>
      <div class="row mut" style="font-size:12px;margin-top:6px">
        <span>Earned: ${f0(e)}</span>
        <span>Total YTM: ${f0(Y)}</span>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="ghost" onclick="editBondModal('${a.b.isin}')">✏️ Edit Bond</button>
      </div>
    </div>`
  }).join('')+`</div>`;
}

    <label class=mut>Face Value (₹)</label><input id="eb_face" type="number" value="${b.face}">

async function saveBondEdit(isin){
  const bond={
    isin,

    coupon:+$('#eb_coupon').value,

  };
  try{setData(await api('updateBond',{bond}));$('#sheet').hidden=true;toast('Bond updated successfully')}catch(e){toast(e.message)}

function vInt(){
  const cur=mkey(0);S.mo=S.mo||cur;
  const filteredBonds=filterBonds(S.B.A).map(a=>a.b.isin);
  const filteredPays=S.B.pays.filter(p=>filteredBonds.includes(p.isin));

  const g={};
  filteredPays.forEach(p=>{const m=ISO(p.d).slice(0,7),x=g[m]=g[m]||{r:0,p:0,L:[]};x[p.rec?'r':'p']+=p.amt*kf(p.tds);x.L.push(p)});
  const X=g[S.mo]||{L:[]};

  const groupedByDay={};
  X.L.forEach(p=>{
    const dStr=ISO(p.d);
    groupedByDay[dStr]=groupedByDay[dStr]||[];
    groupedByDay[dStr].push(p);
  });

  const monthGross=X.L.reduce((s,p)=>s+p.amt,0);
  const monthTds=X.L.reduce((s,p)=>s+(p.amt*p.tds/100),0);
  const monthNet=monthGross-(S.net?monthTds:0);

  $('#view').innerHTML=`
  <div class="kpi-container">
    <div class="kpi-box"><span>Monthly Total Payouts</span><b>${f2(monthNet)}</b></div>
    <div class="kpi-box"><span>Gross Payout</span><b>${f2(monthGross)}</b></div>
    <div class="kpi-box"><span>TDS Deducted</span><b>${f2(monthTds)}</b></div>
  </div>
  <div class="row" style="margin:16px 0"><button class="ghost" onclick="mo(-1)">‹ Previous Month</button><b>${lab(S.mo)}</b><button class="ghost" onclick="mo(1)">Next Month ›</button></div>`+
  (Object.keys(groupedByDay).length===0?`<p class="mut">No interest payments in this month.</p>`:
  Object.keys(groupedByDay).sort().map(d=>{
    const list=groupedByDay[d];
    const totalDay=list.reduce((s,p)=>s+p.amt*kf(p.tds),0);
    return `
    <div class="date-group">
      <div class="date-header"><span>📅 ${fd(UTC(d))}</span><span>${f2(totalDay)}</span></div>
      <div style="padding:10px 16px">`+
      list.map(p=>`<div class="row" style="padding:6px 0"><span>${esc(p.name)} (${p.isin})</span><b class="${p.rec?'ok':''}">${f2(p.amt*kf(p.tds))} ${p.rec?'✓ Received':'⌛ Projected'}</b></div>`).join('')+
      `</div></div>`
  }).join(''));
}

function mo(d){const[y,m]=S.mo.split('-').map(Number);S.mo=ISO(Date.UTC(y,m-1+d,1)).slice(0,7);draw()}

async function vReconcile(){
  const pays=S.B.pays.filter(p=>{
    const dStr=ISO(p.d);
    return dStr>=S.neftStart && dStr<=S.neftEnd;
  }).sort((a,b)=>a.d-b.d);

  const totExp=pays.reduce((s,p)=>s+p.amt*kf(p.tds),0);
  const totRec=pays.filter(p=>p.rec).reduce((s,p)=>s+p.amt*kf(p.tds),0);
  const totPend=totExp-totRec;

  const maxVal=Math.max(1,totExp);
  const recH=Math.round((totRec/maxVal)*100);
  const pendH=Math.round((totPend/maxVal)*100);

  $('#view').innerHTML=`
    <div class="kpi-container">
      <div class="kpi-box"><span>Expected Payouts</span><b>${f2(totExp)}</b></div>
      <div class="kpi-box"><span>Verified Received</span><b>${f2(totRec)}</b></div>
      <div class="kpi-box"><span>Awaiting Payout</span><b>${f2(totPend)}</b></div>
    </div>

    <div class="chart-container">
      <h4>Reconciliation Payout Status (Selected Window)</h4>
      <div style="display:flex;justify-content:center;align-items:flex-end;gap:30px;height:120px;padding-top:16px">
        <div style="display:flex;flex-direction:column;align-items:center;width:80px">
          <div style="height:${recH}px;width:100%;background:var(--ok);border-radius:4px 4px 0 0"></div>
          <span class="mut" style="font-size:11px;margin-top:4px">Received</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;width:80px">
          <div style="height:${pendH}px;width:100%;background:var(--gold);border-radius:4px 4px 0 0"></div>
          <span class="mut" style="font-size:11px;margin-top:4px">Pending</span>
        </div>
      </div>
    </div>

    <div class="kpi-box" style="margin-bottom:16px">
      <div class="row">
        <b>Bank NEFT Matching Window</b>
        <button onclick="scanNeftMailLive()">🔄 Scan Gmail NEFT Alerts</button>
      </div>
      <div class="row" style="margin-top:10px;gap:12px">
        <div><label class="mut">From Date: </label><input type="date" id="neftS" value="${S.neftStart}" onchange="S.neftStart=this.value;vReconcile()"></div>
        <div><label class="mut">To Date: </label><input type="date" id="neftE" value="${S.neftEnd}" onchange="S.neftEnd=this.value;vReconcile()"></div>
      </div>
    </div>
    
    <div id="neft-results">
      <table>
        <thead><tr><th>Expected Date</th><th>Bond Name</th><th>Expected Amount</th><th>Status / Click for Thread Link</th></tr></thead>
        <tbody>`+
        (pays.length===0?`<tr><td colspan="4" style="text-align:center" class="mut">No expected payouts in this date range.</td></tr>`:
        pays.map((p,idx)=>{
          const mail=S.neftLogs?.find(l=>Math.abs(l.amount-(p.amt*kf(p.tds)))<=5 && Math.abs(UTC(l.date)-p.d)<=4*DAY);
          return `<tr class="clickable-row" onclick="toggleNeftLink(${idx})">
            <td>${fd(p.d)}</td>
            <td>${esc(p.name)}</td>
            <td>${f2(p.amt*kf(p.tds))}</td>
            <td>
              ${p.rec?`<span class="ok">🟢 Marked Received</span>`:`<span class="mut">⌛ Awaiting Payout</span>`}
              <div id="nlink_${idx}" hidden style="margin-top:6px;font-size:12px">
                ${mail&&mail.link?`<a href="${mail.link}" target="_blank" style="color:var(--ink);text-decoration:underline" onclick="event.stopPropagation()">🔗 Open Gmail Source Thread ↗</a>`:`<span class="mut">No raw email link available</span>`}
              </div>
            </td>
          </tr>`
        }).join(''))+`</tbody></table>
    </div>`;
}

function toggleNeftLink(idx){
  const el=$('#nlink_'+idx);
  if(el) el.hidden = !el.hidden;
}

async function scanNeftMailLive(){
  toast('Scanning Gmail threads...');
  try{
    const res=await api('scanNeft');
    S.neftLogs = res.neftLogs || [];
    toast(`Scan complete. Found ${S.neftLogs.length} alerts.`);
    vReconcile();
  }catch(e){toast('Error: '+e.message)}
}

function vRoadmap(){
  const allTx=S.data.tx.filter(t=>t.type==='BUY').sort((a,b)=>a.date<b.date?-1:1);
  if(!allTx.length){$('#view').innerHTML='<p class=mut>No transactions found.</p>';return}

  const firstDate=UTC(allTx[0].date);
  const elapsedMonths=Math.max(1,((TODAY-firstDate)/DAY/30.4375));
  const totalInv=allTx.reduce((s,t)=>s+t.amount,0);
  const defaultAvgMonthly=Math.round(totalInv/elapsedMonths);

  if(S.customMonthlyInv===undefined) S.customMonthlyInv=defaultAvgMonthly;

  const activeBonds=S.B.A.filter(a=>a.active);
  const weightedYtm=activeBonds.reduce((s,a)=>s+a.cost*a.b.ytm,0)/(activeBonds.reduce((s,a)=>s+a.cost,0)||1);
  const currentMonthlyIncome=activeBonds.reduce((s,a)=>s+a.perYear*kf(a.b.tds)/12,0);
  const currentAnnualIncome=currentMonthlyIncome*12;

  const goal=S.targetGoal||10000000;
  const monthlyRate=(weightedYtm/100)/12;

  const schedule=[];
  let currCap=totalInv;
  let monthsCount=0;
  let now=new Date(TODAY);
  let accumulatedInt=0;

  while(currCap<goal && monthsCount<360){
    monthsCount++;
    now=new Date(now.setUTCMonth(now.getUTCMonth()+1));
    const mStr=ISO(now.getTime()).slice(0,7);
    const lump=S.lumpsums[mStr]||0;
    const baseContrib=+S.customMonthlyInv;
    const totalAddedThisMonth=baseContrib+lump;
    
    const monthlyInt=currCap*monthlyRate;
    accumulatedInt+=monthlyInt;
    currCap+=totalAddedThisMonth+monthlyInt;

    schedule.push({
      monthKey:mStr,
      dateLabel:lab(mStr),
      year:now.getUTCFullYear(),
      contrib:baseContrib,
      lump,
      totalAdded:totalAddedThisMonth,
      interest:monthlyInt,
      accumulatedInt,
      endBalance:currCap
    });
  }

  const targetYear=schedule.length?schedule[schedule.length-1].year:new Date().getFullYear();

  const yearlyObj={};
  schedule.forEach(s=>{
    if(!yearlyObj[s.year]) yearlyObj[s.year]={year:s.year,totalAdded:0,totalInt:0,endBalance:0};
    yearlyObj[s.year].totalAdded+=s.totalAdded;
    yearlyObj[s.year].totalInt+=s.interest;
    yearlyObj[s.year].endBalance=s.endBalance;
  });

  $('#view').innerHTML=`
    <div class="kpi-container">
      <div class="kpi-box"><span>Total Capital Invested</span><b>${f0(totalInv)}</b></div>
      <div class="kpi-box"><span>Current Monthly Received</span><b>${f0(currentMonthlyIncome)}</b></div>
      <div class="kpi-box"><span>Current Annual Received</span><b>${f0(currentAnnualIncome)}</b></div>
      <div class="kpi-box"><span>Historical Avg Monthly Invest</span><b>${f0(defaultAvgMonthly)}</b></div>
      <div class="kpi-box"><span>Portfolio Weighted YTM</span><b>${weightedYtm.toFixed(2)}%</b></div>
      <div class="kpi-box"><span>Estimated Horizon</span><b>${(monthsCount/12).toFixed(1)} Years (${targetYear})</b></div>
    </div>

    <div class="kpi-box" style="margin-top:16px">
      <div class="row">
        <h3>🎯 Financial Freedom & Contribution Simulator</h3>
        <div class="row">
          <label class="mut">Scenario: </label>
          <select id="scenSel" onchange="switchScenario(this.value)">
            <option value="Default">Default Strategy</option>
            ${Object.keys(S.scenarios).map(k=>`<option value="${k}" ${S.currentScenario===k?'selected':''}>${k}</option>`).join('')}
          </select>
          <button class="ghost" onclick="saveScenarioPrompt()">💾 Save Scenario</button>
        </div>
      </div>
      
      <div class="row" style="gap:16px;margin-top:12px">
        <div>
          <label class="mut">Target Wealth Goal (₹):</label>
          <input type="number" id="goalInput" value="${goal}" onchange="S.targetGoal=+this.value;draw()">
        </div>
        <div>
          <label class="mut">Monthly Investment From Next Month (₹):</label>
          <input type="number" id="monthlyContribInput" value="${S.customMonthlyInv}" onchange="S.customMonthlyInv=+this.value;draw()" placeholder="Press Enter / Blur to update">
        </div>
      </div>
      <p class="mut" style="margin-top:14px">
        Investing <b>${f0(S.customMonthlyInv)}/month</b> starting next month at <b>${weightedYtm.toFixed(2)}%</b> YTM will achieve your goal of <b>${f0(goal)}</b> in <b>${monthsCount} months</b> (~${(monthsCount/12).toFixed(1)} Years, around ${targetYear}).
      </p>
    </div>

    <div class="kpi-box" style="margin-top:16px">
      <div class="row">
        <h4>Future Projections & Capital Accumulation Table</h4>
        <div class="seg">
          <button class="${S.roadmapMode==='monthly'?'on':''}" onclick="S.roadmapMode='monthly';draw()">Monthly View</button>
          <button class="${S.roadmapMode==='yearly'?'on':''}" onclick="S.roadmapMode='yearly';draw()">Yearly Summary</button>
        </div>
      </div>

      <table style="margin-top:12px">
        <thead>
          <tr>
            <th>${S.roadmapMode==='monthly'?'Month':'Year'}</th>
            <th>Monthly / Capital Added</th>
            <th>Lump-Sum Bonus</th>
            <th>Interest Earned</th>
            <th>Total Portfolio Value</th>
            ${S.roadmapMode==='monthly'?'<th>Action</th>':''}
          </tr>
        </thead>
        <tbody>`+
        (S.roadmapMode==='monthly'?
          schedule.map(s=>`<tr>
            <td>${s.dateLabel}</td>
            <td>${f0(s.contrib)}</td>
            <td class="${s.lump?'ok':''}">${s.lump?f0(s.lump):'-'}</td>
            <td class="ok">${f0(s.interest)}</td>
            <td><b>${f0(s.endBalance)}</b></td>
            <td><button class="ghost" style="padding:2px 8px;font-size:11px" onclick="editLumpSum('${s.monthKey}',${s.lump})">Edit Bonus</button></td>
          </tr>`).join('')
          :
          Object.values(yearlyObj).map(y=>`<tr>
            <td><b>${y.year}</b></td>
            <td>${f0(y.totalAdded)}</td>
            <td>-</td>
            <td class="ok">${f0(y.totalInt)}</td>
            <td><b>${f0(y.endBalance)}</b></td>
          </tr>`).join('')
        )+`</tbody></table></div>`;
}

function editLumpSum(mKey,current){
  const val=prompt(`Enter one-off lump-sum investment / bonus for ${lab(mKey)} (₹):`,current||0);
  if(val!==null){
    S.lumpsums[mKey]=+val||0;
    draw();
  }
}

function saveScenarioPrompt(){
  const name=prompt('Enter a name for this investment scenario:');
  if(name){
    S.scenarios[name]={
      targetGoal:S.targetGoal,
      customMonthlyInv:S.customMonthlyInv,
      lumpsums:JSON.parse(JSON.stringify(S.lumpsums))
    };
    S.currentScenario=name;
    localStorage.setItem('fb',JSON.stringify(S));
    toast('Scenario saved!');
    draw();
  }
}

function switchScenario(name){
  if(name==='Default'){
    S.currentScenario='Default';
    S.lumpsums={};
  }else if(S.scenarios[name]){
    S.currentScenario=name;
    S.targetGoal=S.scenarios[name].targetGoal;
    S.customMonthlyInv=S.scenarios[name].customMonthlyInv;
    S.lumpsums=JSON.parse(JSON.stringify(S.scenarios[name].lumpsums));
  }
  draw();
}

function vTx(){
  $('#view').innerHTML=`<div class="row" style="margin:12px 0"><button onclick="openBuy()">Add / Buy Bond</button></div>`+
  [...S.data.tx].sort((a,b)=>a.date<b.date?1:-1).map(t=>{
    const b=S.data.bonds.find(x=>x.isin===t.isin)||{name:t.isin};
    return `<div class="card" style="margin-bottom:8px"><div class="row"><b>${esc(b.name)}</b><span>${f0(t.amount)}</span></div><div class="row mut"><span>${fd(UTC(t.date))} · ${t.type} ${t.units} units</span><button class="ghost" onclick="delTx('${t.id}')">Delete</button></div></div>`
  }).join('')
}

function openBuy(){
  $('#sheet').hidden=false;
  $('#sh').innerHTML=`
    <h3>Add / Buy Bond</h3>
    <select id=bs onchange="$('#nb').hidden=this.value!=='new'"><option value=new>New bond…</option>${S.data.bonds.map(b=>`<option value="${b.isin}">${esc(b.name)} (${b.isin})</option>`).join('')}</select>
    <div id=nb>
      <input id=ni placeholder="ISIN (12 chars)"><input id=nn placeholder="Bond Name">
      <input id=nf type=number placeholder="Face Value"><input id=nc type=number step=any placeholder="Coupon %">
      <input id=ny type=number step=any placeholder="YTM %"><input id=nm type=date>
      <input id=np type=number placeholder="Payment Day (31=EOM)"><input id=nt type=number value=10 placeholder="TDS %">
      <select id=nsec><option value="1">Secured</option><option value="0">Unsecured</option></select>
    </div>
    <input id=bd type=date value="${ISO(TODAY)}"><input id=bu type=number placeholder="Units"><input id=ba type=number placeholder="Total Amount Paid">
    <div class="row" style="margin-top:16px"><button class="ghost" onclick="$('#sheet').hidden=true">Cancel</button><button onclick="saveBuy()">Save Position</button></div>
  `;
}

async function saveBuy(){
  const v=id=>$('#'+id).value.trim(),nw=v('bs')==='new',isn=nw?v('ni').toUpperCase():v('bs');
  const bond=nw?{isin:isn,name:v('nn'),face:+v('nf'),coupon:+v('nc'),ytm:+v('ny'),maturity:v('nm'),payday:+v('np'),tds:+v('nt'),secured:+$('#nsec').value}:null;
  try{setData(await api('addTx',{bond,tx:{date:v('bd'),isin:isn,type:'BUY',units:+v('bu'),amount:+v('ba')}}));$('#sheet').hidden=true;toast('Saved')}catch(e){toast(e.message)}
}

async function delTx(id){if(confirm('Delete transaction?'))setData(await api('delTx',{id}))}

if(S.token){ load(); }else{ $('#login').hidden=false; $('#app').hidden=true; }
</script></body></html>
